version: '3.8'

services:
  sglang-defense:
    build: .
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Warn instead of raise when the idle pool-invariant check disagrees.
      - SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE=0
    volumes:
      # Mount HuggingFace cache so the model doesn't redownload
      - ~/.cache/huggingface:/root/.cache/huggingface
